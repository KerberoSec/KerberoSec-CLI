name: sdk-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Quality Checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/CTF/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK and CLI
        run: |
          bun run build:sdk
          bun -F @kerberosec/cli build

      - name: Lint and Format
        run: bun biome check --diagnostic-level=error apps/cli/src/

  test:
    needs: quality-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "24.x"
          - os: windows-latest
            node-version: "24.x"
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - name: Disable NTFS protection in Git
        if: runner.os == 'Windows'
        run: git config --global core.protectNTFS false || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/CTF/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK
        run: bun run build:sdk

      - name: Build CLI
        run: bun -F @kerberosec/cli build

      - name: Run Tests
        run: bun --cwd sdk/packages/llms vitest run src/providers/gateway.test.ts -t "does not pass extra tools"
