services:
  kerberosec:
    build:
      context: .
      dockerfile: Dockerfile
    image: kerberosec-cli:latest
    container_name: kerberosec-cli
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
      - ~/.kerberosec:/root/.kerberosec
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - KERBEROSEC_THEME=dark
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
